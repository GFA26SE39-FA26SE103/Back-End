name: MF-01 backend
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore --configfile NuGet.Config
      - name: Domain unit tests
        run: dotnet test --no-restore --filter "FullyQualifiedName!~ApiFlowTests" --settings coverage.runsettings --collect:'XPlat Code Coverage' --results-directory TestResults
      - run: dotnet publish src/Supermarket.Api -c Release --no-restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: TestResults
  sql-integration:
    # The DB team owns the SQL schema outside the backend repository.
    if: ${{ vars.MF01_SCHEMA_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back-End
    steps:
      - uses: actions/checkout@v4
        with:
          path: Back-End
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MF01_SCHEMA_REPOSITORY }}
          ref: ${{ vars.MF01_SCHEMA_REF || 'main' }}
          path: SchemaSource
          token: ${{ secrets.MF01_SCHEMA_READ_TOKEN || github.token }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start isolated SQL Server
        shell: bash
        run: |
          sql_password="Mf01!$(openssl rand -hex 20)"
          echo "::add-mask::$sql_password"
          echo "MF01_TEST_CONNECTION=Server=localhost,1433;User Id=sa;Password=$sql_password;TrustServerCertificate=True" >> "$GITHUB_ENV"
          docker run -d --name mf01-sql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$sql_password" mcr.microsoft.com/mssql/server:2022-latest
          for attempt in $(seq 1 60); do
            if docker exec mf01-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$sql_password" -C -Q 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: dotnet restore --configfile NuGet.Config
      - name: SQL integration and domain tests
        env:
          MF01_SCHEMA_FILE: ${{ vars.MF01_SCHEMA_FILE || 'FA26SE103_Database_V0.1.sql' }}
          MF01_MONITORING_MIGRATION_FILE: ${{ vars.MF01_MONITORING_MIGRATION_FILE || 'migrations/20261003_01_monitoring_rules_erd_v3.sql' }}
        run: dotnet test --no-restore "-p:Mf01SchemaPath=$GITHUB_WORKSPACE/SchemaSource/$MF01_SCHEMA_FILE" "-p:Mf01MonitoringMigrationPath=$GITHUB_WORKSPACE/SchemaSource/$MF01_MONITORING_MIGRATION_FILE" --settings coverage.runsettings --collect:'XPlat Code Coverage' --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-integration-coverage
          path: Back-End/TestResults
