name: capstone-backend-dev

services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE to the published image digest}
    container_name: capstone-backend-dev
    restart: unless-stopped
    env_file:
      - path: ${API_ENV_FILE:-./api.env}
        format: raw
    environment:
      ConnectionStrings__Redis: redis:6379
    ports:
      - "${API_BIND_IP:-192.168.1.206}:${API_PORT:-5080}:8080"
    networks:
      - sql
      - cache
    volumes:
      - keys:/app/.local/keys
      - videos:/app/.local/videos
      - floor-plans:/app/.local/floor-plans
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    image: redis:8.12.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - cache
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  cache:
    internal: true
  sql:
    external: true
    name: capstone_default

volumes:
  keys:
    name: capstone_backend_dev_keys
  videos:
    name: capstone_backend_dev_videos
  floor-plans:
    name: capstone_backend_dev_floor_plans
